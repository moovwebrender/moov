<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Moov</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
transition:.25s;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
linear-gradient(135deg,#071225,#13253d,#0b1627);
color:#fff;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
width:300px;
height:300px;
border-radius:50%;
background:#00bcd455;
top:-120px;
left:-120px;
filter:blur(80px);
}

body::after{
content:"";
position:fixed;
width:260px;
height:260px;
border-radius:50%;
background:#3b82f655;
bottom:-100px;
right:-100px;
filter:blur(80px);
}

.box{

width:100%;
max-width:430px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.13);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border-radius:28px;

padding:22px;

box-shadow:0 20px 45px rgba(0,0,0,.35);

animation:show .4s;

}

@keyframes show{

from{

opacity:0;

transform:scale(.95);

}

to{

opacity:1;

transform:scale(1);

}

}

.hidden{
display:none;
}

h2{
text-align:center;
margin-bottom:18px;
font-weight:normal;
}

input,select,button{

width:100%;

border:none;

outline:none;

padding:14px;

margin-top:12px;

border-radius:15px;

font-size:15px;

}

input,
select{

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.1);

color:#fff;

}

input::placeholder{

color:#ddd;

}

option{

color:#000;

}

.btn{

background:#00bcd4;

color:#fff;

font-size:16px;

cursor:pointer;

}

.btn:active{

transform:scale(.97);

}

button:disabled{

background:#ffffff15;

color:#bbb;

cursor:not-allowed;

}

.stats{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-bottom:18px;

}

.card{

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.12);

border-radius:18px;

padding:15px;

text-align:center;

backdrop-filter:blur(12px);

}

.card div:first-child{

font-size:13px;

opacity:.8;

margin-bottom:8px;

}

.card div:last-child{

font-size:20px;

font-weight:bold;

}

.phoneBox{

position:relative;

margin-top:12px;

}

.phoneBox input{

margin:0;

padding-left:42px;

}

.clearBtn{

position:absolute;

left:8px;

top:50%;

transform:translateY(-50%);

width:28px;

height:28px;

border-radius:50%;

background:rgba(255,255,255,.12);

color:white;

font-size:18px;

padding:0;

margin:0;

}

.modal{

display:none;

position:fixed;

inset:0;

justify-content:center;

align-items:center;

background:rgba(0,0,0,.45);

backdrop-filter:blur(8px);

}

.m{

width:90%;

max-width:320px;

padding:24px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.15);

border-radius:24px;

backdrop-filter:blur(18px);

text-align:center;

}

.loader{

width:50px;

height:50px;

margin:10px auto 15px;

border:4px solid rgba(255,255,255,.2);

border-top:4px solid #00d4ff;

border-radius:50%;

animation:spin .8s linear infinite;

}

@keyframes spin{

to{

transform:rotate(360deg);

}

}

#msg{

margin-top:15px;

text-align:center;

color:#ffb4b4;

}
.service{
text-align:center;
margin-bottom:15px;
}

#statusDot{
display:inline-block;
width:12px;
height:12px;
border-radius:50%;
background:red;
margin-left:8px;
}
/* =========================
   زر المعاملات
========================= */

.transactionsBtn{
    margin-top:12px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
    cursor:pointer;
    font-size:16px;
}

.transactionsBtn:hover{
    background:rgba(0,188,212,.22);
    border-color:rgba(0,188,212,.4);
}

.transactionsBtn:active{
    transform:scale(.97);
}


/* =========================
   نافذة المعاملات
========================= */

.transactionsModal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.52);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.transactionsWindow{
    width:100%;
    max-width:430px;
    max-height:85vh;

    display:flex;
    flex-direction:column;

    padding:20px;

    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.16);

    border-radius:26px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:0 25px 60px rgba(0,0,0,.45);

    animation:show .3s;
}

.transactionsHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.transactionsHeader h3{
    font-weight:normal;
    font-size:20px;
}

.closeTransactions{
    width:36px;
    height:36px;

    padding:0;
    margin:0;

    border-radius:50%;

    background:rgba(255,255,255,.10);
    color:#fff;

    font-size:21px;
    cursor:pointer;
}

.closeTransactions:hover{
    background:rgba(255,255,255,.18);
}


/* =========================
   منطقة التمرير
========================= */

.transactionsList{
    overflow-y:auto;
    padding:3px 3px 10px;

    max-height:65vh;

    scroll-behavior:smooth;

    scrollbar-width:thin;
    scrollbar-color:rgba(0,188,212,.6) transparent;
}

.transactionsList::-webkit-scrollbar{
    width:5px;
}

.transactionsList::-webkit-scrollbar-track{
    background:transparent;
}

.transactionsList::-webkit-scrollbar-thumb{
    background:rgba(0,188,212,.55);
    border-radius:20px;
}


/* =========================
   بطاقة المعاملة
========================= */

.transactionCard{
    background:rgba(255,255,255,.075);

    border:1px solid rgba(255,255,255,.11);

    border-radius:19px;

    padding:15px;

    margin-bottom:11px;

    box-shadow:0 8px 25px rgba(0,0,0,.12);

    animation:transactionShow .3s;
}

@keyframes transactionShow{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.transactionTop{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.transactionService{
    font-size:17px;
    font-weight:bold;

    color:#fff;
}

.transactionGB{
    padding:5px 10px;

    border-radius:12px;

    background:rgba(0,188,212,.18);

    border:1px solid rgba(0,188,212,.25);

    color:#6eeaff;

    font-size:14px;
}

.transactionRow{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    padding:7px 0;

    border-bottom:1px solid rgba(255,255,255,.06);

    font-size:13px;
}

.transactionRow:last-child{
    border-bottom:none;
}

.transactionLabel{
    opacity:.65;
}

.transactionValue{
    text-align:left;
    word-break:break-word;
}

.transactionDate{
    margin-top:10px;

    text-align:center;

    font-size:11px;

    opacity:.55;
}

.noTransactions{
    text-align:center;
    padding:40px 15px;

    opacity:.7;
}

.transactionLoader{
    width:40px;
    height:40px;

    margin:25px auto 15px;

    border:3px solid rgba(255,255,255,.15);
    border-top:3px solid #00d4ff;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

.transactionsError{
    text-align:center;
    color:#ffb4b4;
    padding:25px 10px;
}

</style>

</head>

<body>

<div class="box">

<div id="login">

<h2>تسجيل الدخول</h2>

<input id="phone" maxlength="8" placeholder="رقم الهاتف">

<input id="password" type="password" maxlength="4" placeholder="كلمة المرور">

<button class="btn" onclick="doLogin()">
تسجيل الدخول
</button>

<div id="msg"></div>

</div>

<div id="dash" class="hidden">
<div class="service">
<span id="statusDot"></span>
<span id="statusText">جاري الفحص...</span>
</div>

<div class="stats">

<div class="card">
<div>أموالي30%</div>
<div id="my_money">0</div>
</div>

<div class="card">
<div>مجموع الأموال</div>
<div id="total_money">0</div>
</div>

<div class="card" style="grid-column:1/3;display:none">
<div>رسوم موف موني </div>
<div id="gifts">0</div>
</div>
<div class="card" style="grid-column:1/3">
<div>أموال المدير</div>
<div id="debts">0</div>
</div>

</div>

<div class="phoneBox">

<button
type="button"
class="clearBtn"
onclick="target.value=''">
×
</button>

<input
id="target"
maxlength="8"
placeholder="رقم المستلم">

</div>

<select id="offer">

<option value="A">6GB</option>

<option value="B">12GB</option>

<option value="C">20GB</option>

<option value="D">40GB</option>

</select>

<button
id="rechargeBtn"
class="btn"
onclick="recharge()">

شحن

</button>

<button
    disabled
    style="display:none">

    السحب غير متاح حاليا

    style="display:none">

    class="transactionsBtn"
    onclick="openTransactions()">

    📋 معاملاتي

</button>

</div>



</div>

<div
id="result"
class="modal">

<div class="m">

<h3 id="resultTitle"></h3>

<div id="resultText"></div>

<button
class="btn"
style="margin-top:20px"
onclick="result.style.display='none'">

إغلاق

</button>

</div>

</div>
<!-- =========================
     نافذة المعاملات
========================= -->

<div id="transactionsModal" class="transactionsModal">

    <div class="transactionsWindow">

        <div class="transactionsHeader">

            <h3>📋 معاملاتي</h3>

            <button
                class="closeTransactions"
                onclick="closeTransactions()">

                ×

            </button>

        </div>

        <div
            id="transactionsList"
            class="transactionsList">

        </div>

    </div>

</div>

<script>

const ok=p=>/^[234]\d{7}$/.test(p);

function logged(){

return localStorage.getItem("phone")&&localStorage.getItem("password");

}
async function doLogin(){

const phone=document.getElementById("phone").value.trim();
const password=document.getElementById("password").value.trim();

const msg=document.getElementById("msg");

msg.textContent="";

if(!ok(phone)||!/^[0-9]{4}$/.test(password)){
msg.textContent="بيانات غير صحيحة";
return;
}

try{

const r=await fetch("/api/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
phone:phone,
password:password
})
});

console.log("HTTP Status:",r.status);

const d=await r.json();

console.log("Server Response:",d);

if(d.status==="success"){

localStorage.clear();

for(const k in d){
localStorage.setItem(k,d[k]);
}

localStorage.setItem("phone",phone);
localStorage.setItem("password",password);

document.getElementById("my_money").textContent=d.my_money||0;
document.getElementById("total_money").textContent=d.total_money||0;
document.getElementById("gifts").textContent=d.gifts||0;
document.getElementById("debts").textContent=d.debts||0;

document.getElementById("login").classList.add("hidden");
document.getElementById("dash").classList.remove("hidden");

return;
}

msg.textContent=d.message||"فشل تسجيل الدخول";

}catch(e){

console.error(e);

msg.textContent=e.message;

}

}



async function recharge(){

if(!logged()){

alert("يجب تسجيل الدخول");

return;

}

rechargeBtn.disabled=true;

result.style.display="flex";

resultTitle.textContent="جاري الشحن";

resultText.innerHTML=`
<div class="loader"></div>
يرجى الانتظار...
`;

try{

let r=await fetch("/api/recharge",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

phone:localStorage.getItem("phone"),

password:localStorage.getItem("password"),

num:localStorage.getItem("phone"),

current_pin:localStorage.getItem("password"),

target:target.value.trim(),

offer:offer.value

})

});

let d=await r.json();

if(d.status=="success"){

resultTitle.textContent="تمت العملية";

resultText.innerHTML="تم الشحن بنجاح.";

if(d.status=="success"){

    resultTitle.textContent="تمت العملية";

    resultText.innerHTML="تم الشحن بنجاح.";

    // 🔄 جلب القيم الجديدة مباشرة من السيرفر
    await refreshUserData();

}else{

    resultTitle.textContent="فشل العملية";

    resultText.innerHTML=d.message||"حدث خطأ";

}

}else{

resultTitle.textContent="فشل العملية";

resultText.innerHTML=d.message||"حدث خطأ";

}

}

catch(e){

resultTitle.textContent="خطأ";

resultText.innerHTML=e.message;

}

rechargeBtn.disabled=false;

}



window.onload=async()=>{

    if(logged()){

        phone.value=localStorage.getItem("phone");
        password.value=localStorage.getItem("password");

        // تسجيل الدخول وعرض الواجهة
        await doLogin();

        // 🔄 التأكد من أن القيم المعروضة هي آخر قيم من Firebase
        await refreshUserData();

    }

};
async function checkService(){

let r=await fetch("/check-service");

let d=await r.json();

let dot=document.getElementById("statusDot");
let text=document.getElementById("statusText");


if(d.available){

dot.style.background="lime";
text.textContent="الشحن متوفر";

}else{

dot.style.background="red";
text.textContent="الشحن غير متوفر مؤقتا";

}

}


checkService();

setInterval(checkService,60000);
function updateOffersByDay() {
    // موريتانيا تستخدم UTC
    const now = new Date();

    // 0=الأحد، 5=الجمعة، 6=السبت
    const day = now.getUTCDay();

    const offerSelect = document.getElementById("offer");

    const optionB = offerSelect.querySelector('option[value="B"]');
    const optionD = offerSelect.querySelector('option[value="D"]');

    // إذا لم يكن الجمعة أو السبت أو الأحد
    if (day !== 5 && day !== 6 && day !== 0) {
        optionB.textContent = "10GB";
        optionD.textContent = "45GB";
    } else {
        optionB.textContent = "12GB";
        optionD.textContent = "40GB";
    }
}

updateOffersByDay();
async function refreshUserData(){

    if(!logged()){
        return false;
    }

    try{

        const r = await fetch("/api/user-data",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                phone:localStorage.getItem("phone"),
                password:localStorage.getItem("password")
            })
        });

        const d = await r.json();

        if(d.status !== "success"){
            console.error("فشل تحديث البيانات:",d);
            return false;
        }

        document.getElementById("my_money").textContent =
            d.my_money ?? 0;

        document.getElementById("total_money").textContent =
            d.total_money ?? 0;

        document.getElementById("gifts").textContent =
            d.gifts ?? 0;

        document.getElementById("debts").textContent =
            d.debts ?? 0;

        // تحديث التخزين المحلي أيضاً
        localStorage.setItem("my_money",d.my_money ?? 0);
        localStorage.setItem("total_money",d.total_money ?? 0);
        localStorage.setItem("gifts",d.gifts ?? 0);
        localStorage.setItem("debts",d.debts ?? 0);

        return true;

    }catch(e){

        console.error("خطأ في تحديث البيانات:",e);
        return false;

    }
}

// ============================================================
//              نظام عرض المعاملات
// ============================================================

function getOfferDisplay(offer){

    // موريتانيا = UTC
    const day = new Date().getUTCDay();

    // الجمعة، السبت، الأحد
    const weekend =
        day === 5 ||
        day === 6 ||
        day === 0;

    const names = {

        A: "6GB",

        B: weekend
            ? "12GB"
            : "10GB",

        C: "20GB",

        D: weekend
            ? "40GB"
            : "45GB"

    };

    return names[offer] || offer;
}


// ============================================================
// استخراج بيانات المعاملة القديمة
// ============================================================

function parseOldTransaction(text){

    text = String(text || "");

    let offer = null;
    let target = "غير معروف";
    let price = "غير معروف";
    let date = "";

    // اكتشاف الخدمة
    if(text.includes("6GB")){
        offer = "A";
    }
    else if(text.includes("12GB") || text.includes("10GB")){
        offer = "B";
    }
    else if(text.includes("20GB")){
        offer = "C";
    }
    else if(text.includes("40GB") || text.includes("45GB")){
        offer = "D";
    }

    // استخراج رقم المستلم
    const targetMatch =
        text.match(/المستلم\s+([234]\d{7})/);

    if(targetMatch){
        target = targetMatch[1];
    }

    // استخراج السعر
    const priceMatch =
        text.match(/بتكلفة\s+([\d.]+)/);

    if(priceMatch){
        price = priceMatch[1];
    }

    // استخراج التاريخ
    const dateMatch =
        text.match(/في\s+(.+?)\s+\(بتوقيت موريتانيا\)/);

    if(dateMatch){
        date = dateMatch[1];
    }

    return {
        offer,
        target,
        price,
        date
    };
}


// ============================================================
// فتح نافذة المعاملات
// ============================================================

async function openTransactions(){

    if(!logged()){

        alert("يجب تسجيل الدخول");

        return;
    }

    const modal =
        document.getElementById("transactionsModal");

    const list =
        document.getElementById("transactionsList");

    modal.style.display="flex";

    list.innerHTML=`
        <div class="transactionLoader"></div>
        <div style="text-align:center;opacity:.7">
            جاري تحميل المعاملات...
        </div>
    `;

    try{

        const r = await fetch("/api/transactions",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                phone:
                    localStorage.getItem("phone"),

                password:
                    localStorage.getItem("password")

            })

        });


        const d = await r.json();


        if(d.status !== "success"){

            list.innerHTML=`
                <div class="transactionsError">
                    ${escapeHTML(
                        d.message ||
                        "تعذر تحميل المعاملات"
                    )}
                </div>
            `;

            return;
        }


        const transactions =
            Array.isArray(d.transactions)
            ? d.transactions
            : [];


        if(transactions.length === 0){

            list.innerHTML=`
                <div class="noTransactions">

                    📭

                    <br><br>

                    لا توجد معاملات حتى الآن

                </div>
            `;

            return;
        }


        list.innerHTML="";


        /*
         * السيرفر يعيد الأحدث أولاً،
         * لذلك نعرضها بنفس الترتيب.
         */

        transactions.forEach((transaction,index)=>{

            const card =
                createTransactionCard(
                    transaction,
                    index
                );

            list.appendChild(card);

        });


    }catch(e){

        console.error(
            "TRANSACTIONS ERROR:",
            e
        );

        list.innerHTML=`
            <div class="transactionsError">

                حدث خطأ أثناء تحميل المعاملات

                <br><br>

                ${escapeHTML(e.message)}

            </div>
        `;
    }
}


// ============================================================
// إنشاء بطاقة معاملة
// ============================================================

function createTransactionCard(transaction,index){

    let offer = null;
    let target = "غير معروف";
    let price = "غير معروف";
    let date = "";
    let type = "شحن";


    // ==========================================
    // المعاملات الجديدة: Object
    // ==========================================

    if(
        typeof transaction === "object" &&
        transaction !== null
    ){

        offer =
            transaction.offer ||
            transaction.service ||
            null;

        target =
            transaction.target ||
            transaction.receiver ||
            "غير معروف";

        price =
            transaction.price ??
            "غير معروف";

        date =
            transaction.date ||
            transaction.timestamp ||
            "";

        type =
            transaction.type ||
            "شحن";

    }

    // ==========================================
    // المعاملات القديمة: String
    // ==========================================

    else{

        const old =
            parseOldTransaction(transaction);

        offer = old.offer;
        target = old.target;
        price = old.price;
        date = old.date;

    }


    // ==========================================
    // تصحيح كمية GB حسب اليوم الحالي
    // ==========================================

    const gb =
        getOfferDisplay(offer);


    const service =
        offer
        ? `خدمة ${gb}`
        : "معاملة";


    const card =
        document.createElement("div");

    card.className="transactionCard";


    card.innerHTML=`

        <div class="transactionTop">

            <div class="transactionService">

                ${escapeHTML(service)}

            </div>

            <div class="transactionGB">

                ${escapeHTML(gb)}

            </div>

        </div>


        <div class="transactionRow">

            <span class="transactionLabel">
                نوع العملية
            </span>

            <span class="transactionValue">
                ${escapeHTML(type)}
            </span>

        </div>


        <div class="transactionRow">

            <span class="transactionLabel">
                المستلم
            </span>

            <span class="transactionValue">
                ${escapeHTML(target)}
            </span>

        </div>


        <div class="transactionRow">

            <span class="transactionLabel">
                التكلفة
            </span>

            <span class="transactionValue">
                ${escapeHTML(String(price))}
            </span>

        </div>


        ${
            date
            ? `
            <div class="transactionDate">

                🕒 ${escapeHTML(date)}

            </div>
            `
            : ""
        }

    `;


    return card;
}


// ============================================================
// حماية عرض النصوص القادمة من Firebase
// ============================================================

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


// ============================================================
// إغلاق نافذة المعاملات
// ============================================================

function closeTransactions(){

    document.getElementById(
        "transactionsModal"
    ).style.display="none";

}


// ============================================================
// إغلاق النافذة عند الضغط خارجها
// ============================================================

document.getElementById(
    "transactionsModal"
).addEventListener("click",function(e){

    if(e.target === this){

        closeTransactions();

    }

});


</script>

</body>
</html>
