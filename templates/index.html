<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Moov</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
transition:.25s;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
linear-gradient(135deg,#071225,#13253d,#0b1627);
color:#fff;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
width:300px;
height:300px;
border-radius:50%;
background:#00bcd455;
top:-120px;
left:-120px;
filter:blur(80px);
}

body::after{
content:"";
position:fixed;
width:260px;
height:260px;
border-radius:50%;
background:#3b82f655;
bottom:-100px;
right:-100px;
filter:blur(80px);
}

.box{

width:100%;
max-width:430px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.13);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border-radius:28px;

padding:22px;

box-shadow:0 20px 45px rgba(0,0,0,.35);

animation:show .4s;

}

@keyframes show{

from{

opacity:0;

transform:scale(.95);

}

to{

opacity:1;

transform:scale(1);

}

}

.hidden{
display:none;
}

h2{
text-align:center;
margin-bottom:18px;
font-weight:normal;
}

input,select,button{

width:100%;

border:none;

outline:none;

padding:14px;

margin-top:12px;

border-radius:15px;

font-size:15px;

}

input,
select{

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.1);

color:#fff;

}

input::placeholder{

color:#ddd;

}

option{

color:#000;

}

.btn{

background:#00bcd4;

color:#fff;

font-size:16px;

cursor:pointer;

}

.btn:active{

transform:scale(.97);

}

button:disabled{

background:#ffffff15;

color:#bbb;

cursor:not-allowed;

}

.stats{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-bottom:18px;

}

.card{

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.12);

border-radius:18px;

padding:15px;

text-align:center;

backdrop-filter:blur(12px);

}

.card div:first-child{

font-size:13px;

opacity:.8;

margin-bottom:8px;

}

.card div:last-child{

font-size:20px;

font-weight:bold;

}

.phoneBox{

position:relative;

margin-top:12px;

}

.phoneBox input{

margin:0;

padding-left:42px;

}

.clearBtn{

position:absolute;

left:8px;

top:50%;

transform:translateY(-50%);

width:28px;

height:28px;

border-radius:50%;

background:rgba(255,255,255,.12);

color:white;

font-size:18px;

padding:0;

margin:0;

}

.modal{

display:none;

position:fixed;

inset:0;

justify-content:center;

align-items:center;

background:rgba(0,0,0,.45);

backdrop-filter:blur(8px);

}

.m{

width:90%;

max-width:320px;

padding:24px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.15);

border-radius:24px;

backdrop-filter:blur(18px);

text-align:center;

}

.loader{

width:50px;

height:50px;

margin:10px auto 15px;

border:4px solid rgba(255,255,255,.2);

border-top:4px solid #00d4ff;

border-radius:50%;

animation:spin .8s linear infinite;

}

@keyframes spin{

to{

transform:rotate(360deg);

}

}

#msg{

margin-top:15px;

text-align:center;

color:#ffb4b4;

}

</style>

</head>

<body>

<div class="box">

<div id="login">

<h2>تسجيل الدخول</h2>

<input id="phone" maxlength="8" placeholder="رقم الهاتف">

<input id="password" type="password" maxlength="4" placeholder="كلمة المرور">

<button class="btn" onclick="doLogin()">
تسجيل الدخول
</button>

<div id="msg"></div>

</div>

<div id="dash" class="hidden">

<div class="stats">

<div class="card">
<div>أموالي</div>
<div id="my_money">0</div>
</div>

<div class="card">
<div>مجموع الأموال</div>
<div id="total_money">0</div>
</div>

<div class="card" style="grid-column:1/3">
<div>الهدايا</div>
<div id="gifts">0</div>
</div>

</div>

<div class="phoneBox">

<button
type="button"
class="clearBtn"
onclick="target.value=''">
×
</button>

<input
id="target"
maxlength="8"
placeholder="رقم المستلم">

</div>

<select id="offer">

<option value="A">العرض A</option>

<option value="B">العرض B</option>

<option value="C">العرض C</option>

<option value="D">العرض D</option>

</select>

<button
id="rechargeBtn"
class="btn"
onclick="recharge()">

شحن

</button>

<button disabled>

السحب غير متاح حاليا

</button>

<button disabled>

الهدايا غير متاحة حاليا

</button>

</div>

</div>

<div
id="result"
class="modal">

<div class="m">

<h3 id="resultTitle"></h3>

<div id="resultText"></div>

<button
class="btn"
style="margin-top:20px"
onclick="result.style.display='none'">

إغلاق

</button>

</div>

</div>

<script>

const ok=p=>/^[234]\d{7}$/.test(p);

function logged(){

return localStorage.getItem("phone")&&localStorage.getItem("password");

}
async function doLogin(){

const phone=document.getElementById("phone").value.trim();
const password=document.getElementById("password").value.trim();

const msg=document.getElementById("msg");

msg.textContent="";

if(!ok(phone)||!/^[0-9]{4}$/.test(password)){
msg.textContent="بيانات غير صحيحة";
return;
}

try{

const r=await fetch("/api/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
phone:phone,
password:password
})
});

console.log("HTTP Status:",r.status);

const d=await r.json();

console.log("Server Response:",d);

if(d.status==="success"){

localStorage.clear();

for(const k in d){
localStorage.setItem(k,d[k]);
}

localStorage.setItem("phone",phone);
localStorage.setItem("password",password);

document.getElementById("my_money").textContent=d.my_money||0;
document.getElementById("total_money").textContent=d.total_money||0;
document.getElementById("gifts").textContent=d.gifts||0;

document.getElementById("login").classList.add("hidden");
document.getElementById("dash").classList.remove("hidden");

return;
}

msg.textContent=d.message||"فشل تسجيل الدخول";

}catch(e){

console.error(e);

msg.textContent=e.message;

}

}



async function recharge(){

if(!logged()){

alert("يجب تسجيل الدخول");

return;

}

rechargeBtn.disabled=true;

result.style.display="flex";

resultTitle.textContent="جاري الشحن";

resultText.innerHTML=`
<div class="loader"></div>
يرجى الانتظار...
`;

try{

let r=await fetch("/api/recharge",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

phone:localStorage.getItem("phone"),

password:localStorage.getItem("password"),

num:localStorage.getItem("phone"),

current_pin:localStorage.getItem("password"),

target:target.value.trim(),

offer:offer.value

})

});

let d=await r.json();

if(d.status=="success"){

resultTitle.textContent="تمت العملية";

resultText.innerHTML="تم إرسال طلب الشحن بنجاح.";

if(d.my_money)
my_money.textContent=d.my_money;

if(d.total_money)
total_money.textContent=d.total_money;

if(d.gifts)
gifts.textContent=d.gifts;

}else{

resultTitle.textContent="فشل العملية";

resultText.innerHTML=d.message||"حدث خطأ";

}

}

catch(e){

resultTitle.textContent="خطأ";

resultText.innerHTML=e.message;

}

rechargeBtn.disabled=false;

}



window.onload=()=>{

if(logged()){

phone.value=localStorage.getItem("phone");

password.value=localStorage.getItem("password");

doLogin();

}

};

</script>

</body>
</html>
